# Helm values for Cilium on the kind cluster. Same settings as Module1/demo.sh
# Step 5, plus one fix (see the initContainers block at the bottom).
#
#   cilium install --version <ver> -f cilium-values.yaml --set k8sServiceHost=<control-plane IP>
#
# k8sServiceHost is deliberately not in this file: it is the control-plane
# node's IP, which differs per cluster, so it is passed on the command line.
---
{
  kubeProxyReplacement: true,
  k8sServicePort: 6443,
  ipam: {
    mode: "kubernetes",
  },
  hubble: {
    relay: {
      enabled: true,
    },
    ui: {
      enabled: true,
    },
  },
  gatewayAPI: {
    enabled: true,
  },
  encryption: {
    enabled: true,
    type: "wireguard",
  },
  authentication: {
    enabled: true,
    mutual: {
      spire: {
        enabled: true,
        install: {
          enabled: true,
          server: {
            # spire-server runs as uid 1000 (the image's USER), but the kubelet
            # creates its socket directory (a hostPath) as root:root 0755. The
            # server then cannot create api.sock, starts shutting down without
            # logging why, and hangs until the liveness probe kills it — the
            # Cilium agents report "Cannot connect to SPIRE server". Chown the
            # directory before the server starts.
            initContainers: [{
              name: "fix-socket-dir-owner",
              image: "docker.io/library/busybox:1.38.0",
              command: [
                "chown",
                "1000:1000",
                "/tmp/spire-server/private",
              ],
              securityContext: {
                runAsUser: 0,
              },
              volumeMounts: [{
                name: "spire-server-socket",
                mountPath: "/tmp/spire-server/private",
              }],
            }],
          },
        },
      },
    },
  },
}
