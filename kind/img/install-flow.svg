<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Install timeline: kind create cluster brings up the control plane with nodes NotReady; installing Gateway API CRDs and Cilium makes the agents run and the nodes Ready; then CoreDNS, Hubble and SPIRE start. Each failure from the troubleshooting table is pinned to the stage where it appears." font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="280" fill="#ffffff"/>

  <!-- stages -->
  <g>
    <rect x="20" y="20" width="200" height="88" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="120" y="42" text-anchor="middle" font-weight="600" fill="#24292f">1 · kind create cluster</text>
    <text x="120" y="62" text-anchor="middle" fill="#24292f">API server, etcd, scheduler up</text>
    <text x="120" y="78" text-anchor="middle" fill="#cf222e">nodes NotReady</text>
    <text x="120" y="94" text-anchor="middle" fill="#cf222e">CoreDNS Pending — no CNI</text>
  </g>
  <g>
    <rect x="260" y="20" width="200" height="88" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="360" y="42" text-anchor="middle" font-weight="600" fill="#24292f">2 · Gateway API CRDs</text>
    <text x="360" y="62" text-anchor="middle" fill="#24292f">kubectl apply standard-install</text>
    <text x="360" y="78" text-anchor="middle" fill="#57606a">must exist before the</text>
    <text x="360" y="94" text-anchor="middle" fill="#57606a">Cilium operator starts</text>
  </g>
  <g>
    <rect x="500" y="20" width="200" height="88" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="600" y="42" text-anchor="middle" font-weight="600" fill="#24292f">3 · cilium install</text>
    <text x="600" y="62" text-anchor="middle" fill="#24292f">agents pull images, run init,</text>
    <text x="600" y="78" text-anchor="middle" fill="#24292f">load eBPF, write CNI config</text>
    <text x="600" y="94" text-anchor="middle" fill="#1a7f37" font-weight="600">nodes → Ready</text>
  </g>
  <g>
    <rect x="740" y="20" width="200" height="88" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="840" y="42" text-anchor="middle" font-weight="600" fill="#24292f">4 · cilium status --wait</text>
    <text x="840" y="62" text-anchor="middle" fill="#24292f">CoreDNS, Hubble relay/UI,</text>
    <text x="840" y="78" text-anchor="middle" fill="#24292f">SPIRE server + agents start</text>
    <text x="840" y="94" text-anchor="middle" fill="#1a7f37" font-weight="600">Cilium: OK</text>
  </g>

  <!-- arrows between stages -->
  <line x1="220" y1="64" x2="258" y2="64" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="460" y1="64" x2="498" y2="64" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="64" x2="738" y2="64" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- failure pins -->
  <text x="260" y="146" font-weight="600" fill="#24292f">Where each failure from the table shows up</text>

  <line x1="120" y1="108" x2="120" y2="156" stroke="#9a6700" stroke-dasharray="3 3"/>
  <rect x="20" y="156" width="200" height="40" rx="4" fill="#fff8c5" stroke="#9a6700"/>
  <text x="120" y="172" text-anchor="middle" fill="#24292f">workers can't join</text>
  <text x="120" y="188" text-anchor="middle" fill="#57606a">DNS blocked → ufw INPUT rule</text>

  <line x1="600" y1="108" x2="600" y2="156" stroke="#9a6700" stroke-dasharray="3 3"/>
  <rect x="500" y="156" width="200" height="40" rx="4" fill="#fff8c5" stroke="#9a6700"/>
  <text x="600" y="172" text-anchor="middle" fill="#24292f">ErrImagePull</text>
  <text x="600" y="188" text-anchor="middle" fill="#57606a">pulls blocked → ufw FORWARD rule</text>

  <rect x="500" y="204" width="200" height="40" rx="4" fill="#fff8c5" stroke="#9a6700"/>
  <text x="600" y="220" text-anchor="middle" fill="#24292f">Init: mount /sys/fs/bpf denied</text>
  <text x="600" y="236" text-anchor="middle" fill="#57606a">rootless Podman → use sudo</text>

  <rect x="500" y="252" width="200" height="24" rx="4" fill="#fff8c5" stroke="#9a6700"/>
  <text x="600" y="268" text-anchor="middle" fill="#24292f">bpf_set_retval probe → 1.21.0-pre.2</text>

  <line x1="840" y1="108" x2="840" y2="156" stroke="#9a6700" stroke-dasharray="3 3"/>
  <rect x="740" y="156" width="200" height="40" rx="4" fill="#fff8c5" stroke="#9a6700"/>
  <text x="840" y="172" text-anchor="middle" fill="#24292f">Cannot connect to SPIRE server</text>
  <text x="840" y="188" text-anchor="middle" fill="#57606a">socket dir owner → init container</text>
</svg>
