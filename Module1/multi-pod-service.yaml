# KYAML: the strict YAML subset kubectl emits with `-o kyaml` (Kubernetes 1.34+).
# Braces and brackets make structure explicit, every string is quoted, and
# indentation can never silently change meaning. It is still valid YAML, so
# `kubectl apply -f` reads it unchanged.
---
{
  apiVersion: "v1",
  kind: "Service",
  metadata: {
    name: "shared-service",
  },
  spec: {
    ports: [{
      port: 80,
      protocol: "TCP",
      targetPort: 80,
    }],
    selector: {
      app: "shared",
    },
  },
}
